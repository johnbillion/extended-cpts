# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Coding Standards
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
      - 'master'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    name: PHP / PHP ${{ matrix.php }}
    uses: szepeviktor/johnbillion_plugin-infrastructure/.github/workflows/reusable-coding-standards.yml@b206f0924d1b830e03cceb32a9b07b8d978ae492
    strategy:
      matrix:
        php:
          # Newest and oldest supported versions of PHP
          - '8.3'
          - '7.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}
